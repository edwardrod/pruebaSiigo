environments {
  chrome {
    webdriver {
      timeouts {
        implicit = 10
        pageLoad = 30
        script = 30
      }
      driver = chrome
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--test-type", "--ignore-certificate-errors", "--window-size=1366,768", "disable-infobars", "--disable-gpu", "--disable-default-apps", "--disable-popup-blocking"]
          prefs {
            profile.default_content_settings.automatic_downloads=1,
            download.prompt_for_download =false,
            download.default_directory = ${user.dir},
            default_content_settings.popups=0,
            plugins.always_open_pdf_externally=true
          }
        }
      }
    }
  }
  edge {
    webdriver {
      timeouts {
        implicit = 10
        pageLoad = 30
        script = 30
      }
      driver = edge
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["test-type", "ignore-certificate-errors",
            "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"],
          prefs {
            profile.default_content_settings.automatic_downloads=1,
            download.prompt_for_download =false,
            download.default_directory = ${user.dir},
            default_content_settings.popups=0,
            plugins.always_open_pdf_externally=true
          }
        }
      }
    }
  }
  firefox {
    webdriver {
      timeouts {
        implicit = 10
        pageLoad = 30
        script = 30
      }
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = [],
          prefs {
            "javascript.options.showInConsole": false,
            "browser.download.folderList": 2,
            "browser.download.dir":${user.dir}
          },
          log {"level": "info"},
        }
      }
    }
  }
}
