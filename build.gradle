buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "net.serenity-bdd:serenity-gradle-plugin:3.9.8"
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:4.0.0.2929"
    }
}

plugins {
    id 'java'
}

apply plugin: 'net.serenity-bdd.serenity-gradle-plugin'

group = 'co.com.pruebaTCS'
version = '1.0'

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '3.2.5'
    cucumberVersion = '6.11.0'
    junitVersion = '4.13.2'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:4.2.17"
    implementation "net.serenity-bdd:serenity-screenplay:4.2.17"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:4.2.17"
    implementation "net.serenity-bdd:serenity-cucumber:4.2.17"
    testImplementation "junit:junit:4.13.2"
    implementation 'org.seleniumhq.selenium:selenium-java:4.21.0'



    testImplementation "junit:junit:${junitVersion}"
}


test {
    useJUnit()
    testLogging.showStandardStreams = true
}